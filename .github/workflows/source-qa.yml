name: Source and JVM regression checks

on:
  push:
    branches: [main, nightly, 'integration/preview-current-main-*', 'fix/qa-localized-catalog-*']
  pull_request:
    branches: [main, nightly]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: source-qa-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-and-jvm:
    name: JDK 21 / Python 3.11 / Kotlin syntax
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out public source without private submodules
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: false

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify release pipeline contracts
        shell: bash
        run: |
          set -euo pipefail
          for test in qa/test_version_scheme.py qa/test_next_version.py qa/test_changelog_assembly.py \
                      qa/test_pr_gate.py qa/test_ai_review.py qa/test_merge_pr.py \
                      qa/test_manual_merge.py qa/test_publish_review.py \
                      qa/test_nightly_release_state.py qa/test_pending_changelog.py; do
            python3 "$test"
          done

      - name: Verify screenshot and default image-quality MobileConfig contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 qa/test_media_quality_screenshot_props.py \
            --source-root . --out "$RUNNER_TEMP/waex-media-screenshot-props"

      - name: Preserve image-quality property contract evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: media-screenshot-props-evidence
          path: |
            ${{ runner.temp }}/waex-media-screenshot-props/*.json
            ${{ runner.temp }}/waex-media-screenshot-props/*.log
          if-no-files-found: warn
          retention-days: 14

      - name: Require complete source parsing tools
        shell: bash
        run: |
          set -euo pipefail
          java -version
          javac -version
          if ! command -v kotlinc >/dev/null 2>&1; then
            echo '::error::Kotlin CLI/compiler missing; syntax checks cannot silently pass.'
            exit 1
          fi
          kotlinc -version

      - name: Verify target-scoped legacy string preference reads
        shell: bash
        run: |
          set -euo pipefail
          python3 qa/test_preference_manager_string_scope.py
          python3 qa/mutate_preference_manager_string_scope.py --out "$RUNNER_TEMP/preference-string-scope-mutants"

      - name: Preserve scoped string preference mutation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: preference-string-scope-mutants
          path: |
            ${{ runner.temp }}/preference-string-scope-mutants/results.json
            ${{ runner.temp }}/preference-string-scope-mutants/*/run.log
          retention-days: 14
          if-no-files-found: error

      - name: Verify call-blocking opt-out and target-switch contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 qa/test_call_privacy_optout.py --out "$RUNNER_TEMP/call-privacy-optout"
          python3 qa/mutate_call_privacy_optout.py --out "$RUNNER_TEMP/call-privacy-optout-mutants"

      - name: Preserve call-blocking opt-out evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: call-privacy-optout-evidence
          path: |
            ${{ runner.temp }}/call-privacy-optout/*.json
            ${{ runner.temp }}/call-privacy-optout/*.log
            ${{ runner.temp }}/call-privacy-optout/*.kt
            ${{ runner.temp }}/call-privacy-optout-mutants/**/*.json
            ${{ runner.temp }}/call-privacy-optout-mutants/**/*.log
          retention-days: 14
          if-no-files-found: error

      - name: Verify bounded Maven dependency recovery
        shell: bash
        run: |
          set -euo pipefail
          python3 qa/test_maven_dependencies.py --out "$RUNNER_TEMP/waex-maven-recovery"

      - name: Upload Maven dependency recovery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maven-dependency-recovery-evidence
          path: |
            ${{ runner.temp }}/waex-maven-recovery/result.json
            ${{ runner.temp }}/waex-maven-recovery/test_*/*.log
            ${{ runner.temp }}/waex-maven-recovery/test_*/*retry.json
            ${{ runner.temp }}/waex-maven-recovery/test_*/calls.jsonl
            ${{ runner.temp }}/waex-maven-recovery/test_*/config.json
          retention-days: 14
          if-no-files-found: error

      - name: Parse all production Java and Kotlin files (no Android SDK)
        shell: bash
        run: |
          set -euo pipefail
          python3 qa/check_syntax.py --root app/src/main/java

      - name: Test the fail-closed syntax checker itself
        shell: bash
        run: |
          set -euo pipefail
          python3 qa/test_syntax_checker.py

      - name: Verify media constructor hook with cold and persisted DexKit caches
        shell: bash
        run: |
          set -euo pipefail
          python3 qa/test_media_warm_cache.py \
            --source-root . \
            --out "$RUNNER_TEMP/media-warm-cache-contract"

      - name: Preserve media cache and callback contract evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: media-warm-cache-contract-evidence
          path: |
            ${{ runner.temp }}/media-warm-cache-contract/RESULTS.json
            ${{ runner.temp }}/media-warm-cache-contract/*.stdout.txt
            ${{ runner.temp }}/media-warm-cache-contract/*.stderr.txt
            ${{ runner.temp }}/media-warm-cache-contract/*/cache-input.properties
          if-no-files-found: error
          retention-days: 14

      - name: Validate complete status style and property hook contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 qa/test_status_style_hook_contract.py --out "$RUNNER_TEMP/status-style-hook-contract"

      - name: Preserve status style hook contract evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: status-style-hook-contract-evidence
          path: |
            ${{ runner.temp }}/status-style-hook-contract/*.json
            ${{ runner.temp }}/status-style-hook-contract/*.log
            ${{ runner.temp }}/status-style-hook-contract/sources
          if-no-files-found: error
          retention-days: 14

      - name: Run required public-source JVM regression suites
        shell: bash
        run: |
          set -euo pipefail
          tests=(
            qa/test_provider_scope.py
            qa/test_preference_write_types.py
            qa/test_bridge_contract.py
            qa/test_bridge_ordering.py
            qa/test_media_preference_sync.py
            qa/mutate_media_preference_sync.py
            qa/test_parallel_download_stream_contract.py
            qa/test_dnd_preference_policy.py
            qa/test_dex_negative_cache.py
            qa/test_android24_compatibility.py
            qa/test_restart_safety.py
            qa/test_tasker_runtime_gate.py
            qa/test_double_tap_adapter_binding.py
            qa/test_profile_photo_save.py
            qa/test_status_media_export.py
            qa/test_hook_return_types.py
            qa/test_monet_wiring.py
            qa/test_catalog_source.py
            qa/test_catalog_apk.py
            qa/test_catalog_resource_keep.py
            qa/test_edit_history_identity.py
            qa/test_edit_history_adapter_binding.py
            qa/test_edit_history_diff_budget.py
          )
          for test_script in "${tests[@]}"; do
            echo "::group::$test_script"
            python3 "$test_script"
            echo '::endgroup::'
          done

      - name: Verify public Spanish Latin America resources and runtime lookup
        shell: bash
        run: |
          set -euo pipefail
          test -f qa/localization_support.py
          test -f qa/test_es419_localization.py
          test -f qa/test_es419_runtime.py
          python3 qa/test_es419_localization.py
          python3 qa/test_es419_runtime.py

      - name: Require tests for merged runtime and resource contracts
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f app/src/main/java/com/waenhancer/utils/DeclaredWhatsAppTargets.java ]]; then
            test -f qa/test_declared_targets.py
          fi
          if [[ -f app/src/main/java/com/waenhancer/utils/InjectionEvidence.kt ]]; then
            test -f qa/test_runtime_diagnostics.py
            test -f qa/fixtures/RuntimeDiagnosticsChecks.kt
          fi
          store=app/src/main/java/com/waenhancer/xposed/features/automation/PresenceStateStore.java
          ui=app/src/main/java/com/waenhancer/ui/screens/settings/StylesSettingsScreen.kt
          if grep -q 'updateAndGetTransition(' "$store"; then
            test -f qa/test_presence_invalidation.py
            test -f qa/test_presence_state_invalidation.py
          fi
          if [[ -f app/src/main/java/com/waenhancer/xposed/features/automation/PresenceToastsHook.java ]]; then
            test -f qa/test_receipt_observation.py
            test -f qa/fixtures/receipt_observation/ReceiptObservationFixture.java.in
          fi
          if grep -q 'putPublicString("seentick", nextPlacement)' "$ui"; then
            test -f qa/test_manual_seen_tick_persistence.py
          fi
          if [[ -f app/src/main/res/raw/waex_dynamic_menu_icons_keep.xml ]]; then
            test -f qa/test_dynamic_menu_resources.py
          fi
          if [[ -f app/src/main/java/com/waenhancer/xposed/features/privacy/StatusHookContract.java ]]; then
            test -f qa/test_status_hook_contract.py
            test -f qa/java/TestStatusHookContract.java
            test -f qa/fixtures/StatusHookBindingChecks.java
          fi
          if [[ -f app/src/main/java/com/waenhancer/xposed/features/privacy/AntiRevokeHook.java ]]; then
            test -f qa/test_revoke_sqlite_contract.py
            test -f qa/fixtures/RevokeSqliteBindingChecks.java
          fi

      - name: Require stability tests when their implementations are present
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f app/src/main/java/com/waenhancer/update/UpdateTransferPolicy.kt ]]; then
            test -f qa/test_update_download_contract.py
            test -f qa/test_update_session.py
          fi
          if [[ -f app/src/main/java/com/waenhancer/ui/components/RuntimeObservationClock.kt ]]; then
            test -f qa/test_runtime_observation_clock.py
          fi
          if grep -q 'Collections.unmodifiableMap(next)' app/src/main/java/com/waenhancer/xposed/features/customization/FilterItemsHook.kt; then
            test -f qa/test_filter_work.py
          fi
          if grep -q 'release failed:' app/src/main/java/com/waenhancer/xposed/features/media/CallRecordingHook.java; then
            test -f qa/test_recorder_cleanup.py
          fi
          if [[ -f app/src/main/java/com/waenhancer/calls/RecordingOutputFiles.java ]]; then
            test -f qa/test_call_recording_output_safety.py
            test -f qa/fixtures/RecordingOutputFilesProbe.java
          fi
          if [[ -f app/src/main/java/com/waenhancer/xposed/features/media/CallRecordingEventContract.java ]]; then
            test -f qa/test_call_recording_lifecycle.py
            test -f qa/fixtures/CallRecordingLifecycleChecks.java
          fi

      - name: Require regression tests for scoped export and identity changes
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f app/src/main/java/com/waenhancer/xposed/features/media/GalleryMediaExporter.java ]]; then
            test -f qa/test_gallery_export.py
          fi
          if [[ -f app/src/main/java/com/waenhancer/utils/ContactIdentityPolicy.java ]]; then
            test -f qa/test_contact_identity.py
          fi
          if grep -q 'prefs.contains("hide_forwarded_tag")' app/src/main/java/com/waenhancer/xposed/features/privacy/HideForwardedTagHook.kt; then
            test -f qa/test_forwarded_metadata_scope.py
          fi

      - name: Run remaining required public-source QA suites
        shell: bash
        run: |
          set -euo pipefail
          # These contracts are already present in main. A missing suite must fail
          # this job instead of silently reducing regression coverage.
          for test_script in \
            qa/test_audit_apks.py \
            qa/test_native_alignment.py \
            qa/test_dex_source_anchor_inventory.py \
            qa/test_dex_field_inventory.py \
            qa/test_feature_contract_inventory.py \
            qa/test_preference_type_audit.py \
            qa/test_provider_derived_keys.py \
            qa/test_backup_alias_policy.py \
            qa/test_settings_backup_binary_roundtrip.py \
            qa/test_settings_backup_json.py \
            qa/test_aosp_json_source_fetch.py \
            qa/test_feature_preference_schema_coverage.py \
            qa/test_catalog_schema_alias_contract.py \
            qa/test_slovenian_locale.py \
            qa/test_style_boolean_alias_wiring.py \
            qa/test_style_non_boolean_guard.py \
            qa/test_private_hook_logs.py \
            qa/test_exception_message_privacy.py \
            qa/test_call_privacy_logs.py \
            qa/test_database_dialog_status_log_privacy.py \
            qa/test_blue_receipt_recipient_isolation.py \
            qa/test_manual_blue_tick_ui.py \
            qa/test_manual_seen_tick_persistence.py \
            qa/test_receipt_job_execution_contract.py \
            qa/test_selected_upstream_hardening.py \
            qa/test_receipt_observation.py \
            qa/test_presence_event_contract.py \
            qa/test_presence_state_replay.py \
            qa/test_presence_invalidation.py \
            qa/test_presence_state_invalidation.py \
            qa/test_archived_chats_entry.py \
            qa/test_deleted_indicator_bridge.py \
            qa/test_deleted_indicator_preference_types.py \
            qa/test_proximity_event_isolation.py \
            qa/test_proximity_ui_wiring.py \
            qa/test_notification_memory.py \
            qa/test_preserved_own_revoke.py \
            qa/test_status_hook_contract.py \
            qa/test_revoke_sqlite_contract.py \
            qa/test_startup_reconciliation.py \
            qa/test_tasker_policy.py \
            qa/test_separate_groups_policy.py \
            qa/test_declared_targets.py \
            qa/test_runtime_diagnostics.py \
            qa/test_dynamic_menu_resources.py \
            qa/test_update_download_contract.py \
            qa/test_update_session.py \
            qa/test_runtime_observation_clock.py \
            qa/test_filter_work.py \
            qa/test_recorder_cleanup.py \
            qa/test_call_recording_output_safety.py \
            qa/test_call_recording_lifecycle.py \
            qa/test_gallery_export.py \
            qa/test_contact_identity.py \
            qa/test_db_migrations.py; do
            echo "::group::$test_script"
            python3 "$test_script"
            echo '::endgroup::'
          done
          # The earlier forwarding implementation was reverted. Keep its suite
          # conditional until it returns; the implementation guard above still
          # requires the fixture when that source contract is present.
          if [[ -f qa/test_forwarded_metadata_scope.py ]]; then
            echo '::group::qa/test_forwarded_metadata_scope.py'
            python3 qa/test_forwarded_metadata_scope.py
            echo '::endgroup::'
          fi

      - name: Scope of verification
        shell: bash
        run: |
          printf '%s\n' \
            'Source QA passed. This is NOT a Gradle/Android build.' \
            'No private :licensing module or proprietary WhatsApp APK was used.' \
            'Hook installation, runtime behavior, signatures and LSPosed compatibility require separate device checks.'

  framework-inputs:
    name: Verified framework graph / SDKs 24, 28, 34
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify bounded dependency acquisition and transfer controls
        shell: bash
        run: |
          set -euo pipefail
          python3 qa/test_framework_dependency_bundle.py --out "$RUNNER_TEMP/waex-framework-input-evidence/bundle-controls"
          python3 qa/test_prepare_robolectric_sdks.py --out "$RUNNER_TEMP/waex-framework-input-evidence/sdk-controls"
          python3 qa/test_prepare_framework_dependencies.py --out "$RUNNER_TEMP/waex-framework-input-evidence/graph-controls"
      - name: Restore the exact locked framework graph
        id: framework_cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/waex-appearance-hooks/framework-deps
          key: waex-framework36-${{ runner.os }}-${{ hashFiles('qa/framework_dependency_lock.json') }}
      - name: Restore the exact locked Android SDKs
        id: sdk_cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/waex-appearance-hooks/sdk-jars
          key: waex-sdk3-${{ runner.os }}-${{ hashFiles('qa/framework_dependency_lock.json') }}
      - name: Prepare and verify all 39 locked inputs
        shell: bash
        run: |
          set -euo pipefail
          framework_cache_args=()
          if [[ "${{ steps.framework_cache.outputs.cache-hit }}" == "true" ]]; then framework_cache_args+=(--offline); fi
          python3 qa/prepare_framework_dependencies.py \
            --out "$RUNNER_TEMP/waex-appearance-hooks/framework-deps" \
            --report "$RUNNER_TEMP/waex-framework-input-evidence/deps.json" "${framework_cache_args[@]}"
          sdk_cache_args=()
          if [[ "${{ steps.sdk_cache.outputs.cache-hit }}" == "true" ]]; then sdk_cache_args+=(--offline); fi
          python3 qa/prepare_robolectric_sdks.py \
            --out "$RUNNER_TEMP/waex-appearance-hooks/sdk-jars" \
            --report "$RUNNER_TEMP/waex-framework-input-evidence/sdks.json" "${sdk_cache_args[@]}"
      - name: Save the verified framework graph
        if: steps.framework_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/waex-appearance-hooks/framework-deps
          key: waex-framework36-${{ runner.os }}-${{ hashFiles('qa/framework_dependency_lock.json') }}
      - name: Save the verified SDK graph
        if: steps.sdk_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/waex-appearance-hooks/sdk-jars
          key: waex-sdk3-${{ runner.os }}-${{ hashFiles('qa/framework_dependency_lock.json') }}
      - name: Bind the reviewed graph to this run, attempt and source
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$RUNNER_TEMP/waex-appearance-hooks/sdk-jars" "$RUNNER_TEMP/waex-framework-inputs/sdk-view" <<'PYSDKVIEW'
          import os, sys
          from pathlib import Path
          sys.path.insert(0, str(Path.cwd() / 'qa'))
          from framework_dependency_bundle import LOCK, checked, load_lock
          sdks, view = map(Path, sys.argv[1:])
          if sdks.is_symlink() or not sdks.is_dir() or view.exists() or view.is_symlink():
              raise ValueError('Expected verified flat SDK directory and a fresh separate view')
          if view.resolve().is_relative_to(sdks.resolve()) or sdks.resolve().is_relative_to(view.resolve()):
              raise ValueError('SDK input and view must be separate')
          items = [item for item in load_lock(LOCK) if item['directory'] == 'sdk-jars']
          if len(items) != 3 or {path.name for path in sdks.iterdir()} != {item['name'] for item in items}:
              raise ValueError('Expected exactly the three locked SDK inputs')
          for item in items:
              checked(sdks / item['name'], item)
          view.mkdir(parents=True)
          for item in items:
              target = view / item['maven_path']
              target.parent.mkdir(parents=True, exist_ok=True)
              os.link(sdks / item['name'], target)
              checked(target, item)
          PYSDKVIEW
          python3 qa/framework_dependency_bundle.py create \
            --deps "$RUNNER_TEMP/waex-appearance-hooks/framework-deps" \
            --maven-repo "$RUNNER_TEMP/waex-framework-inputs/sdk-view" \
            --bundle "$RUNNER_TEMP/waex-framework-verified" \
            --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT" --head-sha "$GITHUB_SHA" \
            --report "$RUNNER_TEMP/waex-framework-input-evidence/bundle.json"
      - name: Verify Gradle consumer identities and receipt rejection
        shell: bash
        run: |
          set -euo pipefail
          python3 qa/test_runtime_framework_inputs.py --bundle "$RUNNER_TEMP/waex-framework-verified" --out "$RUNNER_TEMP/waex-framework-input-evidence/runtime-controls"
          python3 qa/test_gradle_framework_consumers.py --bundle "$RUNNER_TEMP/waex-framework-verified" --out "$RUNNER_TEMP/waex-framework-input-evidence/gradle-controls"
      - name: Share only the verified current-run dependency graph
        uses: actions/upload-artifact@v4
        with:
          name: waex-framework-inputs-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/waex-framework-verified
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
      - name: Preserve dependency acquisition evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: framework-input-evidence
          path: ${{ runner.temp }}/waex-framework-input-evidence/**/*.json
          retention-days: 14
          if-no-files-found: warn

  android-presence-rows:
    needs: framework-inputs
    name: Extracted renderer / Android framework / native pixels
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: false
      - name: Determine whether the reviewed renderer has been merged
        id: presence
        shell: bash
        run: |
          set -euo pipefail
          renderer=app/src/main/java/com/waenhancer/xposed/features/customization/OnlinePresenceIndicatorsHook.kt
          if [[ -f "$renderer" ]] && grep -q 'private fun stateForRow(' "$renderer"; then
            test -f qa/android_presence_row_test.py
            test -f qa/fixtures/PresenceRowRenderingTest.kt
            test -f qa/test_presence_state_replay.py
            test -f qa/test_presence_runner_controls.py
            test -f qa/mutate_presence_rows.py
            echo 'present=true' >> "$GITHUB_OUTPUT"
          else
            echo 'present=false' >> "$GITHUB_OUTPUT"
            echo '::notice::Presence renderer not in this tree; Android presence rendering was NOT tested by this job.'
          fi
      - uses: actions/setup-java@v4
        if: steps.presence.outputs.present == 'true'
        with:
          distribution: temurin
          java-version: '21'
      - name: Download the current-run verified framework graph
        if: steps.presence.outputs.present == 'true'
        uses: actions/download-artifact@v4
        with:
          name: waex-framework-inputs-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/waex-presence-framework-bundle
      - name: Restore the exact Android 16 instrumented SDK
        if: steps.presence.outputs.present == 'true'
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/waex-presence-sdk-jars/android-all-instrumented-16-robolectric-13921718-i7.jar
          key: waex-presence-sdk36-${{ runner.os }}-${{ hashFiles('qa/presence_framework_sdks.json') }}
      - name: Verify the same-run graph and stage SDKs 28, 34 and 36
        id: presence_inputs
        if: steps.presence.outputs.present == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 qa/test_prepare_presence_framework.py --out "$RUNNER_TEMP/waex-presence-inputs/controls"
          python3 qa/prepare_presence_framework.py \
            --bundle "$RUNNER_TEMP/waex-presence-framework-bundle" \
            --out "$RUNNER_TEMP/waex-presence-sdk-jars" \
            --report "$RUNNER_TEMP/waex-presence-inputs/before.json" \
            --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT" --head-sha "$GITHUB_SHA"
      - name: Run required framework tests for the merged renderer
        if: steps.presence.outputs.present == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 qa/test_presence_runner_controls.py
          python3 qa/android_presence_row_test.py --out "$RUNNER_TEMP/waex-android-rows" --mutations \
