  stability-framework:
    name: Stability / real Android Views and Compose runtime
    needs: framework-inputs
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: false
      - name: Select only implementations actually present and require their fixtures
        id: modes
        shell: bash
        run: |
          set -euo pipefail
          modes=""
          if [[ -f app/src/main/java/com/waenhancer/update/UpdateTransferPolicy.kt ]]; then
            modes="$modes update"; test -f qa/fixtures/StabilityUpdateTest.kt
          fi
          if [[ -f app/src/main/java/com/waenhancer/ui/components/RuntimeObservationClock.kt ]]; then
            modes="$modes clock"; test -f qa/fixtures/StabilityClockTest.kt
          fi
          if grep -q 'Collections.unmodifiableMap(next)' app/src/main/java/com/waenhancer/xposed/features/customization/FilterItemsHook.kt; then
            modes="$modes filter"; test -f qa/fixtures/StabilityFilterTest.kt
          fi
          if [[ -n "$modes" ]]; then test -f qa/verify_stability_framework.py; fi
          echo "modes=$modes" >> "$GITHUB_OUTPUT"
          if [[ -z "$modes" ]]; then echo '::notice::Stability production changes absent; no stability framework tests executed.'; fi
      - uses: actions/setup-java@v4
        if: steps.modes.outputs.modes != ''
        with:
          distribution: temurin
          java-version: '21'
      - name: Retrieve dependencies from the successful producer in this run attempt
        if: steps.modes.outputs.modes != ''
        uses: actions/download-artifact@v4
        with:
          name: waex-framework-dependencies-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/waex-shared-framework
      - name: Verify exact dependency bytes, CI origin and consumer boundaries
        id: framework_inputs
        if: steps.modes.outputs.modes != ''
        shell: bash
        run: |
          set -euo pipefail
          python3 qa/framework_dependency_bundle.py verify \
            --bundle "$RUNNER_TEMP/waex-shared-framework" \
            --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT" --head-sha "$GITHUB_SHA" \
            --report "$RUNNER_TEMP/waex-stability-dependency-bundle.json"
          python3 qa/test_gradle_framework_consumers.py \
            --out "$RUNNER_TEMP/waex-gradle-consumer-controls" \
            --bundle "$RUNNER_TEMP/waex-shared-framework" \
            2>&1 | tee "$RUNNER_TEMP/waex-gradle-consumer-controls.log"
      - name: Execute compiled production sources with real framework dependencies
        if: steps.modes.outputs.modes != ''
        shell: bash
        env:
          MODES: ${{ steps.modes.outputs.modes }}
        run: |
          set -euo pipefail
          bundle=(--framework-bundle "$RUNNER_TEMP/waex-shared-framework"
                  --bundle-run-id "$GITHUB_RUN_ID" --bundle-run-attempt "$GITHUB_RUN_ATTEMPT" --bundle-head-sha "$GITHUB_SHA")
          if [[ "$MODES" == ' update clock filter' ]]; then
            python3 qa/verify_stability_framework.py --out "$RUNNER_TEMP/waex-stability/all" "${bundle[@]}"
          else
            for mode in $MODES; do
              python3 qa/verify_stability_framework.py --mode "$mode" --out "$RUNNER_TEMP/waex-stability/$mode" "${bundle[@]}"
            done
          fi
      - name: Recheck shared bytes after the attempted framework consumer
        if: always() && steps.framework_inputs.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          python3 qa/framework_dependency_bundle.py verify \
            --bundle "$RUNNER_TEMP/waex-shared-framework" \
            --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT" --head-sha "$GITHUB_SHA" \
            --report "$RUNNER_TEMP/waex-stability-dependency-bundle-after.json"
      - uses: actions/upload-artifact@v4
        if: always() && steps.modes.outputs.modes != ''
        with:
          name: stability-framework-evidence
          path: |
            ${{ runner.temp }}/waex-stability-dependency-bundle*.json
            ${{ runner.temp }}/waex-gradle-consumer-controls/result.json
            ${{ runner.temp }}/waex-gradle-consumer-controls.log
            ${{ runner.temp }}/waex-stability/*/evidence
          retention-days: 14
          if-no-files-found: error

