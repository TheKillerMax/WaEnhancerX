name: Pinned Android parser and verification evidence
on:
  push:
    branches: [test/backup-parser-validation-2026-10-14]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  collect:
    if: github.repository == 'TheKillerMax/WaEnhancerX'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Fetch unmodified Android 14 JSON implementation and record origin
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence/aosp-json evidence/tools
          base='https://android.googlesource.com/platform/libcore/+/refs/tags/android-14.0.0_r1/json/src/main/java/org/json'
          printf '%s\n' "$base" > evidence/aosp-json/ORIGIN.txt
          for name in JSON JSONArray JSONException JSONObject JSONStringer JSONTokener; do
            curl --fail --silent --show-error --retry 2 --max-time 60 "$base/$name.java?format=TEXT" | base64 --decode > "evidence/aosp-json/$name.java"
            test -s "evidence/aosp-json/$name.java"
          done
          sha256sum evidence/aosp-json/*.java > evidence/aosp-json/SHA256SUMS
          sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          test -f "$sdk/build-tools/36.0.0/lib/apksigner.jar"
          cp "$sdk/build-tools/36.0.0/lib/apksigner.jar" evidence/tools/apksigner-36.0.0.jar
          cp "$sdk/build-tools/36.0.0/source.properties" evidence/tools/build-tools-source.properties
          java -jar evidence/tools/apksigner-36.0.0.jar version > evidence/tools/apksigner-version.txt
          sha256sum evidence/tools/apksigner-36.0.0.jar > evidence/tools/SHA256SUMS
      - name: Capture current public PR and issue evidence with pagination
        shell: bash
        run: |
          python3 - <<'PY'
          import json, pathlib, urllib.request
          base='https://api.github.com/repos/WaEnhancerX/WaEnhancerX'
          out=pathlib.Path('evidence/github');out.mkdir(parents=True,exist_ok=True)
          def get(path):
              req=urllib.request.Request(base+path,headers={'Accept':'application/vnd.github+json','User-Agent':'waex-public-source-qa'})
              with urllib.request.urlopen(req, timeout=45) as response: return json.load(response)
          def pages(path):
              result=[]
              for page in range(1,21):
                  rows=get(path+('&' if '?' in path else '?')+'per_page=100&page='+str(page))
                  result.extend(rows)
                  if len(rows)<100: return result
              raise RuntimeError('Pagination exceeds explicit bound')
          issues=pages('/issues?state=all')
          (out/'issues.json').write_text(json.dumps(issues,indent=2))
          prs=pages('/pulls?state=open')
          (out/'open-prs.json').write_text(json.dumps(prs,indent=2))
          (out/'main.json').write_text(json.dumps(get('/git/ref/heads/main'),indent=2))
          comments=pages('/issues/comments?since=2026-10-14T00:00:00Z')
          (out/'issue-comments.json').write_text(json.dumps(comments,indent=2))
          reviews=pages('/pulls/comments?since=2026-10-14T00:00:00Z')
          (out/'review-comments.json').write_text(json.dumps(reviews,indent=2))
          for pr in prs:
              n=pr['number']
              (out/f'pr-{n}-reviews.json').write_text(json.dumps(pages(f'/pulls/{n}/reviews'),indent=2))
          print('Open PRs:',[p['number'] for p in prs])
          print('Issue comments since cutoff:',len(comments),'review comments:',len(reviews))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: waex-android-parser-tools-v14
          path: evidence/
          include-hidden-files: true
          retention-days: 7
