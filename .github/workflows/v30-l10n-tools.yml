name: V30 localization tools
on:
  push:
    branches: ['test/es419-localization-review-v30-2026-10-17']
    paths: ['.github/workflows/v30-l10n-tools.yml']
permissions:
  contents: read
jobs:
  tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Collect public tools and input inventory
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p out/wheels out/android out/inventory
          python -m pip download --only-binary=:all: --dest out/wheels tree-sitter==0.25.2 tree-sitter-kotlin==1.1.0 tree-sitter-java==0.23.5
          cp "$ANDROID_HOME/build-tools/36.0.0/aapt2" out/android/
          cp "$ANDROID_HOME/platforms/android-36/android.jar" out/android/
          gh api --paginate '/repos/WaEnhancerX/WaEnhancerX/issues?state=all&per_page=100' --slurp > out/inventory/issues.json
          gh api --paginate '/repos/WaEnhancerX/WaEnhancerX/issues/comments?per_page=100' --slurp > out/inventory/comments.json
          gh api --paginate '/repos/WaEnhancerX/WaEnhancerX/pulls?state=all&per_page=100' --slurp > out/inventory/pulls.json
          gh api '/repos/WaEnhancerX/WaEnhancerX/git/ref/heads/main' > out/inventory/main.json
          cd out
          find . -type f -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: waex-v30-localization-tools
          path: out/
          retention-days: 3
