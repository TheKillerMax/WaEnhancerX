name: V32 localized display resource binding
on:
  push:
    branches: ['test/full-review-v32-2026-10-17']
    paths: ['.github/workflows/v32-hma-locale-resource-binding.yml']
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Reuse the pinned reviewed builder and bind only the fixture's R IDs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib,subprocess,json,urllib.request,base64,hashlib,os
          # This immutable builder is the exact display-only patch already checked
          # against tree 7004626. It is not an arbitrary downloaded script.
          workflow=subprocess.check_output(['git','show','785bd08274d14224a0f678f2d4261c3c83572f23:.github/workflows/v32-hma-locale-check.yml'],text=True)
          start=workflow.index('          set -euo pipefail\n')
          end=workflow.index('      - name: Run source and actual Android resource tests',start)
          lines=workflow[start:end].splitlines()
          assert all(not line or line.startswith('          ') for line in lines)
          builder='\n'.join(line[10:] for line in lines)+'\n'
          subprocess.run(['bash','-c',builder],check=True)
          sha='9d3913e00b1c7a071269fb33d8ea541d98d49062'
          request=urllib.request.Request('https://api.github.com/repos/TheKillerMax/WaEnhancerX/git/blobs/'+sha,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
          with urllib.request.urlopen(request,timeout=45) as response: blob=json.load(response)
          assert blob['encoding']=='base64'
          data=base64.b64decode(blob['content'])
          assert hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()==sha
          pathlib.Path('qa/fixtures/LocalizationResourcesTest.kt').write_bytes(data)
          PY
          git add -A
          git diff --cached --check
          test "$(git write-tree)" = 'e81989533dda582bac7a3e763528ef9793d384d0'
      - name: Re-run unchanged value assertions with actual Android resources
        run: |
          set -euo pipefail
          python3 qa/test_es419_localization.py
          python3 qa/test_es419_runtime.py
          python3 qa/verify_runtime_framework.py --out "$RUNNER_TEMP/v32-hma-locale"
      - name: Store exact validated public-source blobs without moving refs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import subprocess,os,json,pathlib,urllib.request
          files=subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines()
          assert len(files)==10
          out=[]
          for path in files:
              content=pathlib.Path(path).read_text()
              expected=subprocess.check_output(['git','hash-object',path],text=True).strip()
              request=urllib.request.Request('https://api.github.com/repos/TheKillerMax/WaEnhancerX/git/blobs',data=json.dumps({'content':content,'encoding':'utf-8'}).encode(),headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'},method='POST')
              with urllib.request.urlopen(request,timeout=45) as response: result=json.load(response)
              assert result['sha']==expected
              out.append({'path':path,'sha':expected,'mode':'100644','type':'blob'})
          pathlib.Path(os.environ['RUNNER_TEMP'],'v32-hma-locale','evidence','blobs.json').write_text(json.dumps(out,indent=2))
          print(json.dumps(out))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v32-hma-localization-final
          path: ${{ runner.temp }}/v32-hma-locale/evidence
          retention-days: 7
