name: V20 dynamic icon shrinker regression
on:
  push:
    branches: ['test/apk-startup-audit-v20-2026-10-15']
    paths: ['.github/workflows/v20-icon-shrinker-fixture.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  resource-fixture:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 748652656a251593efa8b15cbdae06d0c147f50c
          submodules: false
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Test the icon contract and build an isolated optimized resource fixture
        shell: bash
        run: |
          set -euo pipefail
          python3 qa/test_dynamic_menu_resources.py
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json,os,re,shutil,subprocess,sys,urllib.request
          root=Path.cwd();sys.path.insert(0,str(root/'qa'))
          from test_dynamic_menu_resources import validate
          names=validate(root)
          base=Path(os.environ['RUNNER_TEMP'])/'v20-icons';base.mkdir()
          out=base/'evidence';out.mkdir()
          fixture=base/'fixture';fixture.mkdir()
          src=fixture/'src/main';(src/'java/org/waex/qa/fixture').mkdir(parents=True)
          (src/'assets').mkdir();(src/'res/drawable').mkdir(parents=True);(src/'res/raw').mkdir()
          (fixture/'settings.gradle').write_text('pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }\ndependencyResolutionManagement { repositories { google(); mavenCentral() } }\nrootProject.name="icon-fixture"\n')
          (fixture/'build.gradle').write_text('plugins { id "com.android.application" version "9.0.1" }\nandroid { namespace "org.waex.qa.fixture"; compileSdk 36; defaultConfig { applicationId "org.waex.qa.fixture"; minSdk 24; targetSdk 36; versionCode 1; versionName "qa" }; buildTypes { release { minifyEnabled true; shrinkResources true; proguardFiles getDefaultProguardFile("proguard-android-optimize.txt") } } }\n')
          (fixture/'gradle.properties').write_text('org.gradle.jvmargs=-Xmx3g\nandroid.useAndroidX=true\n')
          (src/'AndroidManifest.xml').write_text('<manifest xmlns:android="http://schemas.android.com/apk/res/android"><application android:label="Resource QA"><activity android:name=".ProbeActivity" android:exported="true"><intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter></activity></application></manifest>')
          (src/'assets/icons.json').write_text(json.dumps(names))
          (src/'java/org/waex/qa/fixture/ProbeActivity.java').write_text('package org.waex.qa.fixture; public class ProbeActivity extends android.app.Activity { public void onCreate(android.os.Bundle state) { super.onCreate(state); android.view.View v=new android.view.View(this);v.setBackgroundResource(R.drawable.ic_waex_download);setContentView(v); try { java.io.InputStream in=getAssets().open("icons.json");java.io.ByteArrayOutputStream out=new java.io.ByteArrayOutputStream();byte[] b=new byte[1024];int n;while((n=in.read(b))>=0)out.write(b,0,n);in.close();org.json.JSONArray list=new org.json.JSONArray(out.toString("UTF-8"));for(int i=0;i<list.length();i++)android.util.Log.i("ResourceQA",Integer.toString(getResources().getIdentifier(list.getString(i),"drawable",getPackageName()))); }catch(Exception e){throw new RuntimeException(e);} } }')
          sources={}
          for name in names:
              p=root/'app/src/main/res/drawable'/(name+'.xml')
              shutil.copy2(p,src/'res/drawable'/p.name);sources[str(p.relative_to(root))]=hashlib.sha256(p.read_bytes()).hexdigest()
          keep=root/'app/src/main/res/raw/waex_dynamic_menu_icons.keep.xml'
          sources[str(keep.relative_to(root))]=hashlib.sha256(keep.read_bytes()).hexdigest()
          aapt=Path(os.environ['ANDROID_HOME'])/'build-tools/36.0.0/aapt2'
          results={}
          for label in ['baseline','retained']:
              if label=='retained':shutil.copy2(keep,src/'res/raw'/keep.name)
              cmd=['bash',str(root/'gradlew'),'--no-daemon','-p',str(fixture),'clean','assembleRelease']
              with (out/(label+'-build.log')).open('w') as log:p=subprocess.run(cmd,stdout=log,stderr=subprocess.STDOUT,timeout=600)
              if p.returncode:
                  print((out/(label+'-build.log')).read_text()[-18000:]);raise RuntimeError('Fixture build failed: '+label)
              apks=list((fixture/'build/outputs/apk/release').glob('*.apk'))
              if len(apks)!=1:raise RuntimeError('Expected one fixture APK')
              p=subprocess.run([str(aapt),'dump','resources',str(apks[0])],capture_output=True,text=True,check=True)
              (out/(label+'-resources.txt')).write_text(p.stdout)
              present=set(re.findall(r'\sresource 0x[0-9a-fA-F]{8} drawable/(\S+)',p.stdout))
              results[label]={'present':[n for n in names if n in present],'missing':[n for n in names if n not in present],'fixture_apk_sha256':hashlib.sha256(apks[0].read_bytes()).hexdigest()}
          (out/'results.json').write_text(json.dumps(results,indent=2))
          (out/'source-sha256.json').write_text(json.dumps(sources,indent=2))
          for p in ['build.gradle','settings.gradle','gradle.properties']:shutil.copy2(fixture/p,out/p)
          assert results['baseline']['present']==['ic_waex_download'],results
          assert len(results['retained']['present'])==len(names) and not results['retained']['missing'],results
          print('Actual AGP 9.0.1 optimized fixture:',len(results['baseline']['present']),'->',len(results['retained']['present']),'of',len(names),'. NOT a WaEnhancerX APK build, installation or LSPosed test.')
          PY
      - name: Read the new public issue screenshots without posting them
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import urllib.request,os,json,hashlib
          from pathlib import Path
          out=Path(os.environ['RUNNER_TEMP'])/'v20-icons/screenshots';out.mkdir(parents=True)
          links=['910010c3-63cb-48a3-b04d-86f727b86710','bf7cec4b-57d5-4aa0-89d7-d6ba7c9810ec','e90dd6f0-825b-40ad-a29c-fb2857364bbc']
          results=[]
          for i,identity in enumerate(links):
              url='https://github.com/user-attachments/assets/'+identity
              try:
                  with urllib.request.urlopen(url,timeout=45) as r:data=r.read(10*1024*1024+1)
                  if len(data)>10*1024*1024 or not(data.startswith(b'\x89PNG') or data.startswith(b'\xff\xd8')):raise ValueError('Not a supported bounded image')
                  name='issue42-'+str(i)+('.png' if data.startswith(b'\x89PNG') else '.jpg');(out/name).write_bytes(data)
                  results.append({'url':url,'file':name,'sha256':hashlib.sha256(data).hexdigest()})
              except Exception as e:results.append({'url':url,'error':str(e)})
          (out/'sources.json').write_text(json.dumps(results,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: waex-v20-icon-fixture-evidence
          path: |
            ${{ runner.temp }}/v20-icons/evidence
            ${{ runner.temp }}/v20-icons/screenshots
          retention-days: 7
          if-no-files-found: error
