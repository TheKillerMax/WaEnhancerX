name: Lab current ART presence on API28 API34 simulated16K

on:
  workflow_dispatch:
  push:
    branches: [lab/presence-current-source-20261125]
    paths:
      - .github/workflows/android-presence-art-lab.yml
      - qa/build_presence_art_lab.py
      - qa/android_presence_art_lab.py
      - qa/presence_art_lab_lock.json
      - qa/test_presence_art_lab.py
      - qa/test_presence_art_toolchain.py
      - qa/presence_art_probe/**
      - qa/class_metadata_art_probe/toolchain.py
      - qa/class_metadata_art_probe/toolchain-lock.json
      - qa/android_emulator_lab_preflight.py
      - qa/android_emulator_lab_pilot.py
      - qa/android_emulator_lab_adb.py
      - qa/test_android_emulator_lab_adb.py
      - qa/android_emulator_lab_matrix.py
      - qa/android_emulator_lab_matrix_lock.json

permissions:
  contents: read

concurrency:
  group: waex-presence-current-art-lab
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  build:
    if: >-
      github.repository == 'TheKillerMax/WaEnhancerX' &&
      github.ref == 'refs/heads/lab/presence-current-source-20261125' &&
      github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      apk_sha256: ${{ steps.identity.outputs.apk_sha256 }}
    steps:
      - name: Check out the reviewed laboratory sources
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: lab
          persist-credentials: false
          submodules: false
          lfs: false
      - name: Check out the immutable source and original oracles
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 7814908a1213d86f05ef5dc068b548d322a24d94
          path: source
          persist-credentials: false
          submodules: false
          lfs: false
      - name: Require reviewed pilot evidence and run host counterchecks
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0, 'lab/qa')
          from android_emulator_lab_matrix import checked_lock
          for target in ('api28', 'api34', 'api35-16k'):
              checked_lock(Path('lab/qa/android_emulator_lab_matrix_lock.json'), target)
          PY
          python3 lab/qa/test_android_emulator_lab_adb.py 2>&1 | tee "$RUNNER_TEMP/presence-art-adb-controls.log"
          python3 -O lab/qa/test_android_emulator_lab_adb.py 2>&1 | tee "$RUNNER_TEMP/presence-art-adb-controls-optimized.log"
          python3 lab/qa/presence_art_probe/test_presence_art_host.py --out "$RUNNER_TEMP/presence-art-host-controls" 2>&1 | tee "$RUNNER_TEMP/presence-art-host-controls.log"
          python3 lab/qa/test_presence_art_lab.py 2>&1 | tee "$RUNNER_TEMP/presence-art-lab-controls.log"
          python3 lab/qa/test_presence_art_toolchain.py 2>&1 | tee "$RUNNER_TEMP/presence-art-toolchain-controls.log"
          PYTHONOPTIMIZE=1 python3 lab/qa/presence_art_probe/test_presence_art_host.py --out "$RUNNER_TEMP/presence-art-host-controls-optimized" 2>&1 | tee "$RUNNER_TEMP/presence-art-host-controls-optimized.log"
          PYTHONOPTIMIZE=1 python3 lab/qa/test_presence_art_lab.py 2>&1 | tee "$RUNNER_TEMP/presence-art-lab-controls-optimized.log"
          PYTHONOPTIMIZE=1 python3 lab/qa/test_presence_art_toolchain.py 2>&1 | tee "$RUNNER_TEMP/presence-art-toolchain-controls-optimized.log"
      - name: Build one APK with existing JDK21 and SDK36
        shell: bash
        run: |
          set -euo pipefail
          python3 lab/qa/build_presence_art_lab.py \
            --source source --sdk "$ANDROID_HOME" --java-home "$JAVA_HOME_21_X64" \
            --out "$RUNNER_TEMP/presence-art-build"
      - name: Record the independently checked build job hash
        id: identity
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP']) / 'presence-art-build/artifact'
          report = json.loads((root / 'artifact-manifest.json').read_text())
          apk = root / 'presence-art-positive.apk'
          sha = hashlib.sha256(apk.read_bytes()).hexdigest()
          if report['status'] != 'PASS_BUILD_ONLY' or report['ephemeral_key_absent'] is not True:
              raise RuntimeError('Build status or ephemeral key evidence differs')
          if sha != report['apk']['sha256'] or apk.stat().st_size != report['apk']['bytes']:
              raise RuntimeError('Independent build job APK identity differs')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as stream:
              stream.write('apk_sha256=' + sha + '\n')
          PY
      - name: Share the same APK with all three isolated AVD jobs
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1
        with:
          name: presence-art-apk-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/presence-art-build/artifact/
          if-no-files-found: error
          retention-days: 1
          compression-level: 9
      - name: Preserve bounded build reports
        if: always()
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1
        with:
          name: presence-art-build-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/presence-art-build/reports/
            ${{ runner.temp }}/presence-art-adb-controls.log
            ${{ runner.temp }}/presence-art-adb-controls-optimized.log
            ${{ runner.temp }}/presence-art-host-controls/result.json
            ${{ runner.temp }}/presence-art-host-controls.log
            ${{ runner.temp }}/presence-art-lab-controls.log
            ${{ runner.temp }}/presence-art-toolchain-controls.log
            ${{ runner.temp }}/presence-art-host-controls-optimized/result.json
            ${{ runner.temp }}/presence-art-host-controls-optimized.log
            ${{ runner.temp }}/presence-art-lab-controls-optimized.log
            ${{ runner.temp }}/presence-art-toolchain-controls-optimized.log
          if-no-files-found: warn
          retention-days: 14
          compression-level: 9

  art:
    needs: build
    if: >-
      github.repository == 'TheKillerMax/WaEnhancerX' &&
      github.ref == 'refs/heads/lab/presence-current-source-20261125' &&
      github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        target: [api28, api34, api35-16k]
    steps:
      - name: Check out the same laboratory commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: lab
          persist-credentials: false
          submodules: false
          lfs: false
      - name: Download this run's single APK artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: presence-art-apk-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/presence-art-apk
      - name: Preserve the hosted Java identity before selection
        env:
          TARGET: ${{ matrix.target }}
        run: |
          python3 - <<'PYCODE'
          import os, shutil, sys
          from pathlib import Path
          sys.path.insert(0, 'lab/qa')
          from android_emulator_lab_preflight import save, tool_identity
          out = Path(os.environ['RUNNER_TEMP']) / ('presence-art-java-' + os.environ['TARGET'])
          out.mkdir()
          save(out, 'preinstalled-java.json', {
              'java': tool_identity(Path(shutil.which('java') or '/missing/java')),
              'JAVA_HOME': os.environ.get('JAVA_HOME'),
          })
          PYCODE
      - name: Select the exact reviewed Java runtime
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17.0.21+9'
          java-package: jre
          architecture: x64
          check-latest: false
      - name: Verify the selected runtime against the unchanged preflight pin
        env:
          TARGET: ${{ matrix.target }}
        run: |
          python3 - <<'PYCODE'
          import json, os, shutil, subprocess, sys
          from pathlib import Path
          sys.path.insert(0, 'lab/qa')
          from android_emulator_lab_preflight import save, sha256_file, tool_identity
          out = Path(os.environ['RUNNER_TEMP']) / ('presence-art-java-' + os.environ['TARGET'])
          java = Path(shutil.which('java') or '/missing/java').resolve()
          home = Path(os.environ['JAVA_HOME']).resolve()
          pin = json.loads(Path('lab/qa/android_emulator_lab_matrix_lock.json').read_bytes())['tool_sha256']['java']
          record = {'status': 'BLOCKED', 'selected': tool_identity(java), 'JAVA_HOME': str(home), 'required_sha256': pin}
          try:
              if java != home / 'bin/java' or record['selected'].get('sha256') != pin:
                  raise RuntimeError('Selected Java does not match the reviewed launcher and JAVA_HOME')
              record['release_sha256'] = sha256_file(home / 'release')
              if record['release_sha256'] != '59425849bf0f00e83133e485c166042ba1f97b7625a5edc389925bc25e19fe4a':
                  raise RuntimeError('Selected Java release differs from the official reviewed JRE')
              result = subprocess.run([str(java), '-version'], stdin=subprocess.DEVNULL, capture_output=True, text=True, timeout=15)
              record.update(returncode=result.returncode, stdout=result.stdout, stderr=result.stderr)
              if result.returncode != 0 or '17.0.21+9' not in result.stderr:
                  raise RuntimeError('Selected Java version is not the reviewed release')
              record['status'] = 'PASS'
          finally:
              save(out, 'selected-java.json', record)
          PYCODE
      - name: Prepare the reviewed Linux KVM runner
        shell: bash
        env:
          LAB_TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          python3 lab/qa/android_emulator_lab_bootstrap.py \
            --out "$RUNNER_TEMP/presence-art-bootstrap-$LAB_TARGET"
      - name: Boot a fresh AVD and execute the original ART pixel cases
        shell: bash
        env:
          LAB_TARGET: ${{ matrix.target }}
          BUILT_APK_SHA256: ${{ needs.build.outputs.apk_sha256 }}
        run: |
          set -euo pipefail
          python3 lab/qa/android_presence_art_lab.py \
            --target "$LAB_TARGET" --lock lab/qa/android_emulator_lab_matrix_lock.json \
            --artifact "$RUNNER_TEMP/presence-art-apk" --apk-sha256 "$BUILT_APK_SHA256" \
            --out "$RUNNER_TEMP/presence-art-$LAB_TARGET"
      - name: Preserve boot identity, all pixel receipts and cleanup
        if: always()
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1
        with:
          name: presence-art-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/presence-art-${{ matrix.target }}/reports/
            ${{ runner.temp }}/presence-art-bootstrap-${{ matrix.target }}/
            ${{ runner.temp }}/presence-art-java-${{ matrix.target }}/
          if-no-files-found: warn
          retention-days: 14
          compression-level: 9
