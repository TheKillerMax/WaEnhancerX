name: Lab ART presence on API24 API25 API26

on:
  workflow_dispatch:
  push:
    branches: [lab/android-emulator-matrix-nightly8-20261124]
    paths:
      - .github/workflows/android-presence-art-lab.yml
      - qa/build_presence_art_lab.py
      - qa/android_presence_art_lab.py
      - qa/presence_art_lab_lock.json
      - qa/test_presence_art_lab.py
      - qa/presence_art_probe/**
      - qa/android_emulator_lab_pilot.py
      - qa/android_emulator_lab_matrix.py
      - qa/android_emulator_lab_matrix_lock.json

permissions:
  contents: read

concurrency:
  group: waex-presence-art-lab
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  build:
    if: >-
      github.repository == 'TheKillerMax/WaEnhancerX' &&
      github.ref == 'refs/heads/lab/android-emulator-matrix-nightly8-20261124' &&
      github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      apk_sha256: ${{ steps.identity.outputs.apk_sha256 }}
    steps:
      - name: Check out the reviewed laboratory sources
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: lab
          persist-credentials: false
          submodules: false
          lfs: false
      - name: Check out the immutable source and original oracles
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: c52f064bad7ba32445f8515bc2f0421618438975
          path: source
          persist-credentials: false
          submodules: false
          lfs: false
      - name: Require reviewed pilot evidence and run host counterchecks
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0, 'lab/qa')
          from android_emulator_lab_matrix import checked_lock
          for target in ('api24', 'api25', 'api26'):
              checked_lock(Path('lab/qa/android_emulator_lab_matrix_lock.json'), target)
          PY
          python3 lab/qa/presence_art_probe/test_presence_art_host.py --out "$RUNNER_TEMP/presence-art-host-controls" 2>&1 | tee "$RUNNER_TEMP/presence-art-host-controls.log"
          python3 lab/qa/test_presence_art_lab.py 2>&1 | tee "$RUNNER_TEMP/presence-art-lab-controls.log"
      - name: Build one APK with existing JDK21 and SDK36
        shell: bash
        run: |
          set -euo pipefail
          python3 lab/qa/build_presence_art_lab.py \
            --source source --sdk "$ANDROID_HOME" --java-home "$JAVA_HOME_21_X64" \
            --out "$RUNNER_TEMP/presence-art-build"
      - name: Record the independently checked build job hash
        id: identity
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP']) / 'presence-art-build/artifact'
          report = json.loads((root / 'artifact-manifest.json').read_text())
          apk = root / 'presence-art-positive.apk'
          sha = hashlib.sha256(apk.read_bytes()).hexdigest()
          assert report['status'] == 'PASS_BUILD_ONLY' and report['ephemeral_key_absent'] is True
          assert sha == report['apk']['sha256'] and apk.stat().st_size == report['apk']['bytes']
          with open(os.environ['GITHUB_OUTPUT'], 'a') as stream:
              stream.write('apk_sha256=' + sha + '\n')
          PY
      - name: Share the same APK with all three isolated AVD jobs
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1
        with:
          name: presence-art-apk-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/presence-art-build/artifact/
          if-no-files-found: error
          retention-days: 1
          compression-level: 9
      - name: Preserve bounded build reports
        if: always()
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1
        with:
          name: presence-art-build-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/presence-art-build/reports/
            ${{ runner.temp }}/presence-art-host-controls/result.json
            ${{ runner.temp }}/presence-art-host-controls.log
            ${{ runner.temp }}/presence-art-lab-controls.log
          if-no-files-found: warn
          retention-days: 14
          compression-level: 9

  art:
    needs: build
    if: >-
      github.repository == 'TheKillerMax/WaEnhancerX' &&
      github.ref == 'refs/heads/lab/android-emulator-matrix-nightly8-20261124' &&
      github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        target: [api24, api25, api26]
    steps:
      - name: Check out the same laboratory commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: lab
          persist-credentials: false
          submodules: false
          lfs: false
      - name: Download this run's single APK artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: presence-art-apk-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/presence-art-apk
      - name: Prepare the reviewed Linux KVM runner
        shell: bash
        env:
          LAB_TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          python3 lab/qa/android_emulator_lab_bootstrap.py \
            --out "$RUNNER_TEMP/presence-art-bootstrap-$LAB_TARGET"
      - name: Boot a fresh AVD and execute the original ART pixel cases
        shell: bash
        env:
          LAB_TARGET: ${{ matrix.target }}
          BUILT_APK_SHA256: ${{ needs.build.outputs.apk_sha256 }}
        run: |
          set -euo pipefail
          python3 lab/qa/android_presence_art_lab.py \
            --target "$LAB_TARGET" --lock lab/qa/android_emulator_lab_matrix_lock.json \
            --artifact "$RUNNER_TEMP/presence-art-apk" --apk-sha256 "$BUILT_APK_SHA256" \
            --out "$RUNNER_TEMP/presence-art-$LAB_TARGET"
      - name: Preserve boot identity, all pixel receipts and cleanup
        if: always()
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1
        with:
          name: presence-art-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/presence-art-${{ matrix.target }}/reports/
            ${{ runner.temp }}/presence-art-bootstrap-${{ matrix.target }}/
          if-no-files-found: warn
          retention-days: 14
          compression-level: 9
