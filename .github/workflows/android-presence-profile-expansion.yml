name: Lab Presence remaining fifteen Android profiles

on:
  push:
    branches: [lab/presence-profile-expansion-20261126]
    paths:
      - .github/workflows/android-presence-profile-expansion.yml
      - qa/presence_profile_expansion/**

permissions:
  contents: read

concurrency:
  group: waex-presence-profile-expansion-20261126
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONPATH: ${{ github.workspace }}/lab/qa

jobs:
  build:
    if: >-
      github.repository == 'TheKillerMax/WaEnhancerX' &&
      github.ref == 'refs/heads/lab/presence-profile-expansion-20261126' &&
      github.event.repository.private == false &&
      github.event_name == 'push' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      apk_sha256: ${{ steps.identity.outputs.apk_sha256 }}
    steps:
      - name: Check out the reviewed laboratory sources
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: lab
          persist-credentials: false
          submodules: false
          lfs: false
      - name: Check out the immutable source and original oracles
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 7814908a1213d86f05ef5dc068b548d322a24d94
          path: source
          persist-credentials: false
          submodules: false
          lfs: false
      - name: Verify frozen sources and exact matrix admission
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          from pathlib import Path
          from presence_profile_expansion.guard import context_check, TARGET_NAMES
          from android_emulator_lab_matrix import checked_lock
          context_check(os.environ)
          for target in TARGET_NAMES:
              checked_lock(Path('lab/qa/android_emulator_lab_matrix_lock.json'), target)
          PY
      - name: Build one APK with existing JDK21 and SDK36
        shell: bash
        run: |
          set -euo pipefail
          python3 lab/qa/presence_profile_expansion/build_lab.py \
            --source source --sdk "$ANDROID_HOME" --java-home "$JAVA_HOME_21_X64" \
            --out "$RUNNER_TEMP/presence-profile-build"
      - name: Record the independently checked build job hash
        id: identity
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP']) / 'presence-profile-build/artifact'
          report = json.loads((root / 'artifact-manifest.json').read_text())
          apk = root / 'presence-art-positive.apk'
          sha = hashlib.sha256(apk.read_bytes()).hexdigest()
          if report['status'] != 'PASS_BUILD_ONLY' or report['ephemeral_key_absent'] is not True:
              raise RuntimeError('Build status or ephemeral key evidence differs')
          if sha != report['apk']['sha256'] or apk.stat().st_size != report['apk']['bytes']:
              raise RuntimeError('Independent build job APK identity differs')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as stream:
              stream.write('apk_sha256=' + sha + '\n')
          PY
      - name: Share the same APK with all fifteen isolated AVD jobs
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1
        with:
          name: presence-profile-apk-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/presence-profile-build/artifact/
          if-no-files-found: error
          retention-days: 1
          compression-level: 9
      - name: Preserve bounded build reports
        if: always()
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1
        with:
          name: presence-profile-build-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/presence-profile-build/reports/
          if-no-files-found: warn
          retention-days: 14
          compression-level: 9

  art:
    needs: build
    if: >-
      github.repository == 'TheKillerMax/WaEnhancerX' &&
      github.ref == 'refs/heads/lab/presence-profile-expansion-20261126' &&
      github.event.repository.private == false &&
      github.event_name == 'push' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        target: [api27, api29, api30, api31, api32, api33, api35, api36, api37, api36.1, api36-16k, api36.1-16k, api37-16k, api37.1-16k, api37.2-16k]
    steps:
      - name: Check out the same laboratory commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: lab
          persist-credentials: false
          submodules: false
          lfs: false
      - name: Download this run's single APK artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: presence-profile-apk-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/presence-profile-apk
      - name: Preserve the hosted Java identity before selection
        env:
          TARGET: ${{ matrix.target }}
        run: |
          python3 - <<'PYCODE'
          import os, shutil, sys
          from pathlib import Path
          sys.path.insert(0, 'lab/qa')
          from android_emulator_lab_preflight import save, tool_identity
          out = Path(os.environ['RUNNER_TEMP']) / ('presence-profile-java-' + os.environ['TARGET'])
          out.mkdir()
          save(out, 'preinstalled-java.json', {
              'java': tool_identity(Path(shutil.which('java') or '/missing/java')),
              'JAVA_HOME': os.environ.get('JAVA_HOME'),
          })
          PYCODE
      - name: Select the exact reviewed Java runtime
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17.0.21+9'
          java-package: jre
          architecture: x64
          check-latest: false
      - name: Verify the selected runtime against the unchanged preflight pin
        env:
          TARGET: ${{ matrix.target }}
        run: |
          python3 - <<'PYCODE'
          import json, os, shutil, subprocess, sys
          from pathlib import Path
          sys.path.insert(0, 'lab/qa')
          from android_emulator_lab_preflight import save, sha256_file, tool_identity
          out = Path(os.environ['RUNNER_TEMP']) / ('presence-profile-java-' + os.environ['TARGET'])
          java = Path(shutil.which('java') or '/missing/java').resolve()
          home = Path(os.environ['JAVA_HOME']).resolve()
          pin = json.loads(Path('lab/qa/android_emulator_lab_matrix_lock.json').read_bytes())['tool_sha256']['java']
          record = {'status': 'BLOCKED', 'selected': tool_identity(java), 'JAVA_HOME': str(home), 'required_sha256': pin}
          try:
              if java != home / 'bin/java' or record['selected'].get('sha256') != pin:
                  raise RuntimeError('Selected Java does not match the reviewed launcher and JAVA_HOME')
              record['release_sha256'] = sha256_file(home / 'release')
              if record['release_sha256'] != '59425849bf0f00e83133e485c166042ba1f97b7625a5edc389925bc25e19fe4a':
                  raise RuntimeError('Selected Java release differs from the official reviewed JRE')
              result = subprocess.run([str(java), '-version'], stdin=subprocess.DEVNULL, capture_output=True, text=True, timeout=15)
              record.update(returncode=result.returncode, stdout=result.stdout, stderr=result.stderr)
              if result.returncode != 0 or '17.0.21+9' not in result.stderr:
                  raise RuntimeError('Selected Java version is not the reviewed release')
              record['status'] = 'PASS'
          finally:
              save(out, 'selected-java.json', record)
          PYCODE
      - name: Prepare the reviewed Linux KVM runner
        shell: bash
        env:
          LAB_TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          python3 lab/qa/presence_profile_expansion/bootstrap.py \
            --out "$RUNNER_TEMP/presence-profile-bootstrap-$LAB_TARGET"
      - name: Boot a fresh AVD and execute the original ART pixel cases
        shell: bash
        env:
          LAB_TARGET: ${{ matrix.target }}
          BUILT_APK_SHA256: ${{ needs.build.outputs.apk_sha256 }}
        run: |
          set -euo pipefail
          python3 lab/qa/presence_profile_expansion/run_lab.py \
            --target "$LAB_TARGET" --lock lab/qa/android_emulator_lab_matrix_lock.json \
            --artifact "$RUNNER_TEMP/presence-profile-apk" --apk-sha256 "$BUILT_APK_SHA256" \
            --out "$RUNNER_TEMP/presence-profile-$LAB_TARGET"
      - name: Preserve boot identity, all pixel receipts and cleanup
        if: always()
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1
        with:
          name: presence-profile-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/presence-profile-${{ matrix.target }}/reports/
            ${{ runner.temp }}/presence-profile-bootstrap-${{ matrix.target }}/
            ${{ runner.temp }}/presence-profile-java-${{ matrix.target }}/
          if-no-files-found: warn
          retention-days: 14
          compression-level: 9
