name: Materialize reviewed reconciliation objects
on:
  push:
    branches: ['qa/reconcile-three-import-20261110']
    paths: ['.github/workflows/import-reviewed-objects-20261110.yml']
permissions:
  contents: write
jobs:
  objects:
    if: github.repository == 'TheKillerMax/WaEnhancerX'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          submodules: false
          persist-credentials: false
      - name: Validate original bundle and create content-addressed objects without changing any ref
        env:
          GH_OBJECT_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64,datetime,hashlib,json,os,pathlib,re,subprocess,urllib.request
          repo=os.environ['GITHUB_REPOSITORY'];assert repo=='TheKillerMax/WaEnhancerX'
          def git(*args,binary=False):
              out=subprocess.check_output(['git',*args]);return out if binary else out.decode().strip()
          folder=pathlib.Path('.qa-transfer/20261110')
          corrections={0:[[1882,1884,'5P','']],2:[[799,800,'Y',''],[1773,1774,'5',''],[2016,2017,'1','2']],3:[[2438,2439,'5','F'],[2440,2441,'4','']],7:[[1376,1377,'X','/C']],9:[[2190,2193,'Ykq','2m']],10:[[143,144,'0','3'],[247,249,'E2','36']],11:[[677,678,'b','J'],[679,680,'2','Q']],18:[[135,137,'Di','B']]}
          data=[]
          for i in range(22):
              text=(folder/f'{i:02d}.b64').read_text(encoding='ascii')
              for a,b,old,new in reversed(corrections.get(i,[])):
                  assert text[a:b]==old,(i,a,b)
                  text=text[:a]+new+text[b:]
              chunk=base64.b64decode(text,validate=True);assert len(chunk)==(2048 if i<21 else 1619)
              data.append(chunk)
          data=b''.join(data)
          assert len(data)==44627
          assert hashlib.sha256(data).hexdigest()=='4395301be74c59d7db30b22348115a3b88677ace45cbe3efbaae9b7cbbbed10e'
          bundle=pathlib.Path('/tmp/reconciled.bundle');bundle.write_bytes(data)
          subprocess.run(['git','bundle','verify',str(bundle)],check=True)
          base='4750124e36223dd21d8535c14f2fb658025d8480';base_tree=git('rev-parse',base+'^{tree}')
          rows=[
            (105,'08307f32fdc474807cc5db01b470b0106d6e4176','8983558f58fdc27e9a0ed150a13532ae8f7526b6','25dad18b2588dc87cc0763c666ced143cafd3292'),
            (107,'7f1c60ef78b98c85939096b219e6579b9a5d861f','ea3aacca3ae2228d94793ae9a27b37497b4b7744','6bb69f8ad076ebb5832904c80f7d2efcdfb6fcd0'),
            (92,'ccb641e3d3dad174fa12ef24be14b6fefcbfde36','4db8b20d1a687af3cc15b3a37f06fcfb1e42a546','11c7b03db74dd095c48d34fea90e2f5344dee045')]
          def api(path,payload):
              req=urllib.request.Request('https://api.github.com/repos/'+repo+'/git/'+path,data=json.dumps(payload).encode(),headers={'Authorization':'Bearer '+os.environ['GH_OBJECT_TOKEN'],'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','Content-Type':'application/json'},method='POST')
              with urllib.request.urlopen(req,timeout=60) as response:return json.load(response)
          def person(raw):
              m=re.fullmatch(r'(.+) <([^>]+)> (\d+) ([+-]\d{4})',raw);assert m,raw
              offset=m[4];minutes=int(offset[1:3])*60+int(offset[3:5]);minutes=minutes if offset[0]=='+' else -minutes
              stamp=datetime.datetime.fromtimestamp(int(m[3]),datetime.timezone(datetime.timedelta(minutes=minutes))).isoformat()
              return {'name':m[1],'email':m[2],'date':stamp}
          results=[]
          for number,sha,tree,old in rows:
              ref=f'refs/heads/update/pr{number}-v206-20261110'
              subprocess.run(['git','fetch',str(bundle),ref+f':refs/remotes/reviewed/pr{number}'],check=True)
              assert git('rev-parse',ref.replace('refs/heads/update/', 'refs/remotes/reviewed/'))==sha if False else git('rev-parse',f'refs/remotes/reviewed/pr{number}')==sha
              assert git('rev-parse',sha+'^{tree}')==tree
              parents=git('show','-s','--format=%P',sha).split();assert parents==[old,base],parents
              subprocess.run(['git','merge-base','--is-ancestor',old,sha],check=True)
              subprocess.run(['git','merge-base','--is-ancestor',base,sha],check=True)
              names=git('diff','--name-only','--no-renames',base,sha).splitlines();assert 1<=len(names)<=20
              elements=[]
              for path in names:
                  assert path.startswith(('app/src/main/java/','qa/','.github/workflows/')),path
                  assert path.endswith(('.java','.kt','.py','.md','.yml')),path
                  record=git('ls-tree',sha,'--',path)
                  if not record:
                      elements.append({'path':path,'mode':'100644','type':'blob','sha':None});continue
                  metadata,actual_path=record.split('\t',1);mode,kind,blob=metadata.split();assert actual_path==path and kind=='blob' and mode in ('100644','100755')
                  body=git('cat-file','blob',blob,binary=True);assert len(body)<150000
                  calculated=hashlib.sha1(b'blob '+str(len(body)).encode()+b'\0'+body).hexdigest();assert calculated==blob
                  remote_blob=api('blobs',{'content':base64.b64encode(body).decode(),'encoding':'base64'});assert remote_blob['sha']==blob
                  elements.append({'path':path,'mode':mode,'type':'blob','sha':blob})
              remote_tree=api('trees',{'base_tree':base_tree,'tree':elements});assert remote_tree['sha']==tree,(number,remote_tree['sha'],tree)
              raw=git('cat-file','commit',sha,binary=True).decode();header,message=raw.split('\n\n',1)
              author=next(v[len('author '):] for v in header.splitlines() if v.startswith('author '));committer=next(v[len('committer '):] for v in header.splitlines() if v.startswith('committer '))
              remote_commit=api('commits',{'message':message,'tree':tree,'parents':parents,'author':person(author),'committer':person(committer)})
              assert remote_commit['tree']['sha']==tree and [p['sha'] for p in remote_commit['parents']]==parents
              result={'pr':number,'local_sha':sha,'materialized_sha':remote_commit['sha'],'exact_sha':remote_commit['sha']==sha,'tree':tree,'parents':parents,'files':names,'refs_changed':False}
              results.append(result);print(json.dumps(result),flush=True)
              pathlib.Path('/tmp/materialized-objects.json').write_text(json.dumps(results,indent=2)+'\n')
          print('ALL_CONTENT_IDENTITIES_VALIDATED; NO_PRODUCT_REF_OR_PR_CHANGED')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: reviewed-reconciliation-object-identities
          path: /tmp/materialized-objects.json
          if-no-files-found: warn
          retention-days: 14
