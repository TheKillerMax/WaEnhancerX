name: V33 HMA source recovery
on:
  push:
    branches: ['test/review-v32-2026-10-17']
permissions:
  contents: read
jobs:
  collect:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: |
          set -euo pipefail
          git fetch origin b486fff16a2af08595809e2a130c59a498785f33
          mkdir -p evidence
          git diff --binary 8b7dceb404abf7f06ecf67828a35f98619fb8613 b486fff16a2af08595809e2a130c59a498785f33 > evidence/hma.patch
          git ls-tree -r b486fff16a2af08595809e2a130c59a498785f33 > evidence/tree.txt
          sha256sum evidence/hma.patch > evidence/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: waex-v33-hma-source
          path: evidence/
          retention-days: 7
