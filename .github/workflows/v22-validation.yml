name: V22 reviewed runtime and PR reconciliation validation
on:
  push:
    paths: ['.github/workflows/v22-validation.yml']
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify and validate all candidates before preserving objects
        shell: bash
        run: |
          set -euo pipefail
          cp qa/v22_validate_candidates.py "$RUNNER_TEMP/v22_validate_candidates.py"
          python3 "$RUNNER_TEMP/v22_validate_candidates.py"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: waex-v22-reviewed-validation
          path: ${{ runner.temp }}/v22-evidence
          retention-days: 7
          if-no-files-found: error
          include-hidden-files: true
