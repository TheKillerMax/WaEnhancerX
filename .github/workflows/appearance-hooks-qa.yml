name: Floating bar methods and overlay launcher

on:
  push:
    branches: [main, nightly, 'integration/preview-current-main-*', 'integration/android-matrix-nightly8-20261124']
  pull_request:
    branches: [main, nightly]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install and verify the project Kotlin 2.0.20 compiler
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$RUNNER_TEMP/waex-appearance-hooks-toolchain" "$RUNNER_TEMP/waex-appearance-hooks" <<'PYKOTLIN'
          import hashlib, io, json, os, stat, subprocess, sys, urllib.request, zipfile
          from pathlib import Path, PurePosixPath
          destination, evidence = map(Path, sys.argv[1:])
          evidence.mkdir(parents=True, exist_ok=True)
          url = 'https://github.com/JetBrains/kotlin/releases/download/v2.0.20/kotlin-compiler-2.0.20.zip'
          expected = '5f5d2a8ad6a718a002acd0775b67a9e27035872fdbd4b0791e3cb3ea00095931'
          archive_limit, expanded_limit = 128 * 1024 * 1024, 384 * 1024 * 1024
          with urllib.request.urlopen(url, timeout=45) as response:
              archive = response.read(archive_limit + 1)
          if len(archive) > archive_limit or hashlib.sha256(archive).hexdigest() != expected:
              raise RuntimeError('Kotlin compiler archive size or SHA-256 mismatch')
          destination.mkdir(parents=True, exist_ok=False)
          with zipfile.ZipFile(io.BytesIO(archive)) as bundle:
              members = bundle.infolist()
              if len(members) > 4096 or sum(item.file_size for item in members) > expanded_limit:
                  raise RuntimeError('Kotlin compiler expansion exceeds the bounded distribution size')
              seen = set()
              for item in members:
                  relative = PurePosixPath(item.filename)
                  mode = item.external_attr >> 16
                  if (relative.is_absolute() or '..' in relative.parts or not relative.parts
                          or relative.parts[0] != 'kotlinc' or '\\' in item.filename
                          or item.file_size > archive_limit or item.flag_bits & 1
                          or stat.S_IFMT(mode) not in (0, stat.S_IFREG, stat.S_IFDIR)
                          or relative in seen):
                      raise RuntimeError('Unsafe or duplicate Kotlin archive member: ' + item.filename)
                  seen.add(relative)
              for item in members:
                  relative = PurePosixPath(item.filename)
                  target = destination.joinpath(*relative.parts)
                  if item.is_dir():
                      target.mkdir(parents=True, exist_ok=True)
                  else:
                      target.parent.mkdir(parents=True, exist_ok=True)
                      data = bundle.read(item)
                      if len(data) != item.file_size:
                          raise RuntimeError('Kotlin archive entry size mismatch')
                      with target.open('xb') as output:
                          output.write(data)
                      target.chmod(0o755 if relative.parts[:2] == ('kotlinc', 'bin') else 0o644)
          kotlin_home = (destination / 'kotlinc').resolve()
          compiler = kotlin_home / 'bin/kotlinc'
          version = subprocess.run([str(compiler), '-version'], text=True,
              stdout=subprocess.PIPE, stderr=subprocess.STDOUT, check=True, timeout=30).stdout
          if 'kotlinc-jvm 2.0.20 ' not in version:
              raise RuntimeError('The compiler must be exactly Kotlin 2.0.20: ' + version)
          (evidence / 'kotlin-version.log').write_text(version)
          (evidence / 'toolchain.json').write_text(json.dumps({'url': url, 'sha256': expected,
              'bytes': len(archive), 'kotlin_version': '2.0.20', 'compiler': str(compiler)}, indent=2) + '\n')
          with Path(os.environ['GITHUB_ENV']).open('a') as environment:
              environment.write('KOTLIN_HOME=' + str(kotlin_home) + '\n')
          with Path(os.environ['GITHUB_PATH']).open('a') as path_file:
              path_file.write(str(kotlin_home / 'bin') + '\n')
          PYKOTLIN
      - name: Reuse the pinned Android SDK bytes
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/waex-appearance-hooks/sdk-jars
          key: waex-sdk3-${{ runner.os }}-${{ hashFiles('qa/framework_dependency_lock.json') }}
      - name: Verify or prepare the three Android SDKs before offline consumers
        shell: bash
        run: |
          set -euo pipefail
          python3 qa/test_prepare_robolectric_sdks.py --out "$RUNNER_TEMP/waex-appearance-hooks/sdk-transport-controls"
          python3 qa/prepare_robolectric_sdks.py \
            --out "$RUNNER_TEMP/waex-appearance-hooks/sdk-jars" \
            --report "$RUNNER_TEMP/waex-appearance-hooks/sdk-bootstrap.json"
      - name: Restore the exact locked framework dependency cache
        id: framework-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/waex-appearance-hooks/framework-deps
          key: waex-framework36-${{ runner.os }}-${{ hashFiles('qa/framework_dependency_lock.json') }}
      - name: Verify or fetch the 36 pinned dependencies without Maven resolution
        id: framework
        shell: bash
        run: |
          set -euo pipefail
          python3 qa/test_prepare_framework_dependencies.py --out "$RUNNER_TEMP/waex-appearance-hooks/framework-transport-controls"
          python3 qa/prepare_framework_dependencies.py \
            --out "$RUNNER_TEMP/waex-appearance-hooks/framework-deps" \
            --report "$RUNNER_TEMP/waex-appearance-hooks/framework-bootstrap.json"
      - name: Save only the verified framework graph before test consumers
        if: steps.framework-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/waex-appearance-hooks/framework-deps
          key: waex-framework36-${{ runner.os }}-${{ hashFiles('qa/framework_dependency_lock.json') }}
      - name: Exercise bounded Android method bodies and the complete overlay launcher
        shell: bash
        run: |
          set -euo pipefail
          test "$(command -v kotlinc)" = "$KOTLIN_HOME/bin/kotlinc"
          test -f qa/maven_dependencies.py
          test -f qa/android_media_preview_test.py
          python3 qa/test_overlay_permission_resources.py
          python3 qa/android_floating_bottom_bar_methods_test.py \
            --out "$RUNNER_TEMP/waex-appearance-hooks/floating" \
            --deps "$RUNNER_TEMP/waex-appearance-hooks/framework-deps" \
            --sdk-jars "$RUNNER_TEMP/waex-appearance-hooks/sdk-jars"
          python3 qa/mutate_floating_bar_methods.py \
            --positive-result "$RUNNER_TEMP/waex-appearance-hooks/floating/result.json" \
            --out "$RUNNER_TEMP/waex-appearance-hooks/mutations" \
            --deps "$RUNNER_TEMP/waex-appearance-hooks/framework-deps" \
            --core-api-jar "$RUNNER_TEMP/waex-appearance-hooks/floating/public-apis/core-1.18.0.jar" \
            --annotation-api-jar "$RUNNER_TEMP/waex-appearance-hooks/floating/public-apis/annotation-jvm-1.9.1.jar" \
            --dexkit-jar "$RUNNER_TEMP/waex-appearance-hooks/floating/public-apis/dexkit-2.2.0.jar" \
            --sdk-jars "$RUNNER_TEMP/waex-appearance-hooks/sdk-jars"
      - name: Exercise Channel ownership with the same verified dependency bytes
        shell: bash
        run: |
          set -euo pipefail
          args=(
            --deps "$RUNNER_TEMP/waex-appearance-hooks/framework-deps"
            --core-api-jar "$RUNNER_TEMP/waex-appearance-hooks/floating/public-apis/core-1.18.0.jar"
            --annotation-api-jar "$RUNNER_TEMP/waex-appearance-hooks/floating/public-apis/annotation-jvm-1.9.1.jar"
            --dexkit-jar "$RUNNER_TEMP/waex-appearance-hooks/floating/public-apis/dexkit-2.2.0.jar"
            --sdk-jars "$RUNNER_TEMP/waex-appearance-hooks/sdk-jars"
          )
          python3 qa/android_channel_visibility_test.py --out "$RUNNER_TEMP/waex-appearance-hooks/channel" "${args[@]}"
          python3 qa/mutate_channel_visibility.py \
            --positive-result "$RUNNER_TEMP/waex-appearance-hooks/channel/result.json" \
            --out "$RUNNER_TEMP/waex-appearance-hooks/channel-mutations" "${args[@]}"
      - name: Rehash the shared framework graph after all attempted consumers
        if: always() && steps.framework.outcome == 'success'
        run: |
          python3 qa/prepare_framework_dependencies.py --offline \
            --out "$RUNNER_TEMP/waex-appearance-hooks/framework-deps" \
            --report "$RUNNER_TEMP/waex-appearance-hooks/framework-final.json"
      - name: Preserve the declared projection, source identities and execution evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: waex-appearance-hooks-evidence
          path: |
            ${{ runner.temp }}/waex-appearance-hooks/**/*.json
            ${{ runner.temp }}/waex-appearance-hooks/**/*.log
          if-no-files-found: error
          retention-days: 14
