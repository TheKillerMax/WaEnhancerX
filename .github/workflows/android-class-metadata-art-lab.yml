name: Lab ClassValue ART linkage
on:
  workflow_dispatch:
  push:
    branches: [lab/classmetadata-current-source-20261125]
    paths:
      - .github/workflows/android-class-metadata-art-lab.yml
      - qa/class_metadata_art_probe/**
      - qa/android_emulator_lab_preflight.py
      - qa/android_emulator_lab_pilot.py
      - qa/android_emulator_lab_adb.py
      - qa/test_android_emulator_lab_adb.py
      - qa/android_emulator_lab_matrix_lock.json
      - qa/test_android_guest_version.py
permissions:
  contents: read
concurrency:
  group: waex-class-metadata-current-art-lab
  cancel-in-progress: false
env:
  PYTHONDONTWRITEBYTECODE: '1'
jobs:
  build:
    if: >-
      github.repository == 'TheKillerMax/WaEnhancerX' &&
      github.ref == 'refs/heads/lab/classmetadata-current-source-20261125' &&
      github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      manifest_sha256: ${{ steps.identity.outputs.manifest_sha256 }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: lab
          persist-credentials: false
          submodules: false
          lfs: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 72174b77e6d102f7550b527ce2c2b83bd320b38a
          path: baseline
          persist-credentials: false
          submodules: false
          lfs: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 7814908a1213d86f05ef5dc068b548d322a24d94
          path: candidate
          persist-credentials: false
          submodules: false
          lfs: false
      - name: Acquire the existing pinned DexKit input with bounded transport
        shell: bash
        run: |
          set -euo pipefail
          python3 candidate/qa/prepare_dexkit.py --cache "$RUNNER_TEMP/classmeta-dexkit" --report "$RUNNER_TEMP/classmeta-inputs/dexkit.json"
      - name: Validate receipt oracle and build two immutable DEX probes
        shell: bash
        run: |
          set -euo pipefail
          python3 lab/qa/test_android_guest_version.py
          python3 -O lab/qa/test_android_guest_version.py
          python3 lab/qa/test_android_emulator_lab_adb.py
          python3 -O lab/qa/test_android_emulator_lab_adb.py
          python3 lab/qa/class_metadata_art_probe/test_toolchain.py
          python3 -O lab/qa/class_metadata_art_probe/test_toolchain.py
          python3 lab/qa/class_metadata_art_probe/run.py --host-tests
          python3 lab/qa/class_metadata_art_probe/build.py --baseline baseline --candidate candidate --sdk "$ANDROID_HOME" --java-home "$JAVA_HOME_21_X64" --dexkit-jar "$RUNNER_TEMP/classmeta-dexkit/dexkit-2.2.0.jar" --out "$RUNNER_TEMP/classmeta-build"
      - name: Bind the producer manifest to every runtime job
        id: identity
        shell: bash
        run: |
          set -euo pipefail
          manifest="$RUNNER_TEMP/classmeta-build/artifact/artifact-manifest.json"
          test -s "$manifest"
          echo "manifest_sha256=$(sha256sum "$manifest" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1
        with:
          name: classmeta-build-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/classmeta-build/artifact/
          if-no-files-found: error
          retention-days: 1
      - uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1
        if: always()
        with:
          name: classmeta-build-receipts-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/classmeta-build/*.log
            ${{ runner.temp }}/classmeta-build/kotlin-toolchain.json
            ${{ runner.temp }}/classmeta-build/*-fixture/result.json
            ${{ runner.temp }}/classmeta-build/*-fixture/*.log
            ${{ runner.temp }}/classmeta-inputs/*.json
            ${{ runner.temp }}/classmeta-inputs/*.log
          if-no-files-found: warn
          retention-days: 14
  art:
    needs: build
    if: >-
      github.repository == 'TheKillerMax/WaEnhancerX' &&
      github.ref == 'refs/heads/lab/classmetadata-current-source-20261125' &&
      github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        target: [api24, api30, api33, api34]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: lab
          persist-credentials: false
          submodules: false
          lfs: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: classmeta-build-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/classmeta-artifact
      - name: Preserve the hosted Java identity before selection
        env:
          TARGET: ${{ matrix.target }}
        run: |
          python3 - <<'PYCODE'
          import os, shutil, sys
          from pathlib import Path
          sys.path.insert(0, 'lab/qa')
          from android_emulator_lab_preflight import save, tool_identity
          out = Path(os.environ['RUNNER_TEMP']) / ('classmeta-java-' + os.environ['TARGET'])
          out.mkdir()
          save(out, 'preinstalled-java.json', {
              'java': tool_identity(Path(shutil.which('java') or '/missing/java')),
              'JAVA_HOME': os.environ.get('JAVA_HOME'),
          })
          PYCODE
      - name: Select the exact reviewed Java runtime
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17.0.21+9'
          java-package: jre
          architecture: x64
          check-latest: false
      - name: Verify the selected runtime against the unchanged preflight pin
        env:
          TARGET: ${{ matrix.target }}
        run: |
          python3 - <<'PYCODE'
          import json, os, shutil, subprocess, sys
          from pathlib import Path
          sys.path.insert(0, 'lab/qa')
          from android_emulator_lab_preflight import save, sha256_file, tool_identity
          out = Path(os.environ['RUNNER_TEMP']) / ('classmeta-java-' + os.environ['TARGET'])
          java = Path(shutil.which('java') or '/missing/java').resolve()
          home = Path(os.environ['JAVA_HOME']).resolve()
          pin = json.loads(Path('lab/qa/android_emulator_lab_matrix_lock.json').read_bytes())['tool_sha256']['java']
          record = {'status': 'BLOCKED', 'selected': tool_identity(java), 'JAVA_HOME': str(home), 'required_sha256': pin}
          try:
              if java != home / 'bin/java' or record['selected'].get('sha256') != pin:
                  raise RuntimeError('Selected Java does not match the reviewed launcher and JAVA_HOME')
              record['release_sha256'] = sha256_file(home / 'release')
              if record['release_sha256'] != '59425849bf0f00e83133e485c166042ba1f97b7625a5edc389925bc25e19fe4a':
                  raise RuntimeError('Selected Java release differs from the official reviewed JRE')
              result = subprocess.run([str(java), '-version'], stdin=subprocess.DEVNULL, capture_output=True, text=True, timeout=15)
              record.update(returncode=result.returncode, stdout=result.stdout, stderr=result.stderr)
              if result.returncode != 0 or '17.0.21+9' not in result.stderr:
                  raise RuntimeError('Selected Java version is not the reviewed release')
              record['status'] = 'PASS'
          finally:
              save(out, 'selected-java.json', record)
          PYCODE
      - name: Bootstrap only the existing reviewed Linux runner
        env:
          TARGET: ${{ matrix.target }}
        run: python3 lab/qa/android_emulator_lab_bootstrap.py --out "$RUNNER_TEMP/classmeta-bootstrap-$TARGET"
      - name: Execute both variants on the owned fresh AVD
        env:
          TARGET: ${{ matrix.target }}
          MANIFEST_SHA256: ${{ needs.build.outputs.manifest_sha256 }}
        run: |
          set -euo pipefail
          python3 lab/qa/class_metadata_art_probe/run.py --target "$TARGET" --lock lab/qa/android_emulator_lab_matrix_lock.json --artifact "$RUNNER_TEMP/classmeta-artifact" --manifest-sha256 "$MANIFEST_SHA256" --out "$RUNNER_TEMP/classmeta-$TARGET"
      - uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1
        if: always()
        with:
          name: classmeta-art-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/classmeta-${{ matrix.target }}/reports/
            ${{ runner.temp }}/classmeta-bootstrap-${{ matrix.target }}/
            ${{ runner.temp }}/classmeta-java-${{ matrix.target }}/
          if-no-files-found: warn
          retention-days: 14
